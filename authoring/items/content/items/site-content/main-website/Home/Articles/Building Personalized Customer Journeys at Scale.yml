    - ID: "63471bba-943c-4d82-b7bf-d7ec82babbf7"
      Hint: ArticleContent
      Value: |
        <div class="ck-content"><p>Most conversational RAG systems work surprisingly well. They answer simple questions perfectly… and then completely fall apart on anything that requires more than one step of reasoning.</p><p>The problem isn’t retrieval. It’s query structure.</p><p>In a conversational RAG search agent, the simplest and most direct path is straightforward: one query, one search, one response.</p><p>This is what we call simple search. While it likely covers the vast majority of use cases, sooner or later you will need to address the remaining, more complex scenarios. But what exactly makes a query complex? And how can we systematically categorize complex queries to gain confidence when testing?</p><p>Without a clear understanding of the patterns behind query decomposition, you risk compensating with quantity over quality—writing more and more tests in an attempt to build confidence, rather than designing fewer, well-targeted tests that truly validate the system’s behavior.</p><p>Without being exhaustive, here are the most common query patterns I was able to identify, and how a conversational search system should treat them.</p><h2>Simple Search</h2><p>A simple search contains a single intent and can be resolved with one retrieval step.</p><p>Who produced Star Wars?</p><p>There is no ambiguity, no dependency, and no need for orchestration. One query goes in, one search is performed, and one answer comes out.</p><p>This is the happy path—and the baseline against which everything else should be measured.</p><h2>Multi-Query (but Not Composite)</h2><p>Moving up the complexity ladder, the next pattern to understand is the multi-query.</p><p>Who is the Star Wars producer? What is a cinema?</p><p>This looks more complex at first glance, but it is not a composite query.</p><ul><li>These are two unrelated questions</li><li>There is no semantic or logical dependency</li><li>Each question can be answered independently</li></ul><p>From a system perspective, this should be treated as multiple simple searches, not a single composite one. The only added responsibility is segmentation, not reasoning.</p><p>This distinction is important: confusing multi-query inputs with composite queries often leads to unnecessary orchestration and over-engineering.</p><h2>Composite Queries</h2><p>A composite query is a single user input that contains multiple related information needs that share a common context which must be decomposed and resolved before producing a unified answer.</p><p>Who is the Star Wars producer and who played Han Solo?</p><p>Here, the system must:</p><ol><li>Identify multiple intents</li><li>Decompose them into sub-queries</li><li>Execute searches</li><li>Merge the results into a coherent response</li></ol><p>Not all composite queries are equal, though. They come in several distinct patterns, each with different implications for retrieval, reasoning, and testing.</p><h2>Conjunctive Composite Queries</h2><p>Pattern: Multiple related questions joined by and, also, or similar connectors.</p><p>Who produced Star Wars and who played Han Solo?</p><p>Each sub-query is independent, but they are logically grouped and expected to be answered together.</p><ul><li>Decompose into parallel searches</li><li>Aggregate results</li><li>Ensure no intent is dropped</li></ul><p>This is often the entry point into composite query handling.</p><h2>Dependent Composite Queries</h2><p>Pattern: The second question depends on the answer to the first.</p><p>Who directed Star Wars and what other movies did he direct?</p><p>You cannot answer the second part without first resolving the entity from the first.</p><ul><li>Resolve the first entity</li><li>Carry context forward</li><li>Issue a follow-up query using the derived entity</li></ul><p>This introduces statefulness, even in otherwise stateless systems.</p><h2>Multi-Hop Queries</h2></div>

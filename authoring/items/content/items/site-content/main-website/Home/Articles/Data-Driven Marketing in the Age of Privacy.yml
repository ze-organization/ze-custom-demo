      Hint: ArticleContent
      Value: |
        <div class="ck-content"><p>Modern ML systems are often described in terms of models, embeddings, feature stores and training pipelines. In practice however, the scalability and reliability of an ML platform is often determined much earlier in the process: at the moment raw interaction data enters the system.</p><p>At Coveo, nearly every ranking, personalization and commerce optimization capability depends on processing enormous volumes of behavioral signals generated across websites, applications and backend systems. Every search, click, recommendation interaction and purchase contributes data that may later influence machine learning outcomes.</p><p>At first glance, this may sound straightforward: clients send JSON payloads, those payloads are stored, and models train on the resulting data. In reality however, operating a large-scale ML platform across hundreds of integrations quickly becomes much more complicated. Payload formats evolve over time, integrations are difficult to change, and many important business concepts cannot be represented directly as single events.</p><p>To manage this complexity, Coveo deliberately separates three concepts that are often conflated:</p><ul><li>raw payloads received from integrations,</li><li>normalized events representing business semantics,</li><li>and higher-level business state derived from collections of events.</li></ul><p>That distinction may sound subtle, but it is foundational to how our ML and analytics systems operate at scale. As a simple analogy, consider how a bank may process an online purchase through a payment provider:</p><ol><li>Receive a JSON payload from the payment provider:{txid: fe24ae8b12c, amt: 49.55}</li><li>Interpret this payload as a debit event on your account and store it:transaction: -49.55</li><li>Process this event and update the bank’s business data model:account total: 529.76</li></ol><p>The first two steps separate the external payload from the internal event representation. A bank may support many different payment providers or multiple protocol versions, all producing different payload structures. The exact syntax of the incoming JSON is ultimately irrelevant; what matters is preserving the meaning of the transaction in a unified format that downstream systems can understand.</p><p>The final step computes current business state from a collection of events. Banks do not simply apply a transaction to a running total and then discard the transaction record itself. Instead, all transactions are retained for auditability, resiliency and historical analysis, while separate processing systems continuously derive the current account state.</p><p>Coveo’s event processing architecture follows a very similar pattern.</p><h2>Payload Normalization</h2><p>There are a number of practical and architectural reasons for creating a clear separation between the payload received from an integration and the event it represents.</p><h3>Separation of concerns</h3><p>It would be extremely difficult for ML data scientists or downstream analytics systems to keep track of the precise details of multiple integration protocols. A model may simply need the revenue associated with a purchase event, without caring whether the value originates from a field named tr in one protocol or transaction.revenue in another.</p><p>This abstraction is conceptually similar to interfaces in software engineering. The normalized Event definition acts as the stable interface consumed internally, while the payload-specific transformation layer implements the details required to map each external protocol into that interface.</p><p>Without this separation, every downstream system would become tightly coupled to every upstream integration format.</p><h3>Integration inertia</h3><p>The ability to abstract away from exact payload syntax is critical because integrations are difficult to change once deployed.</p><p>Customers are understandably hesitant to modify working Coveo integrations running on production websites. The operational risk is significant: website changes may interfere with day-to-day business operations, ownership is often fragmented across teams, and the benefits of integration updates are not always immediately visible to stakeholders. As a result, once an integration is deployed, changing it becomes an uphill battle.</p><p>By isolating protocol-specific concerns within the normalization layer, internal systems can continue to evolve independently while maintaining backward compatibility with integrations that may remain unchanged for years.</p><h3>Changing event sources</h3><p>As the product evolves, the systems responsible for generating events may also change.</p><p>In older integration protocols, for example, search event payloads needed to be sent explicitly from the client browser after search results were received from the Coveo Search API. In more modern Coveo deployment architectures, the Search API itself may generate and log the corresponding payload automatically.</p><p>This transition was transparent to downstream systems because both implementations ultimately produced the same normalized search event, even though the payload origins and transport mechanisms differed significantly.</p><h3>One payload, multiple events</h3><p>The mapping between payloads and events is not always one-to-one.</p><p>Some legacy endpoints accept arrays of objects within a single payload and expand them into multiple independent events during normalization. Similarly, a commerce purchase payload may contain multiple line items which are more conveniently processed as separate downstream events for attribution or analytics purposes.</p><p>The normalization layer is responsible not only for translating payload formats, but also for reshaping incoming data into forms better suited for downstream processing.</p><h2>Events Versus State</h2><p>Returning to the banking analogy, it should be obvious why banks do not discard transaction records after updating an account balance. Customers need to understand how the current balance was produced, and the bank must be able to audit or reconstruct account history if necessary.</p><p>At the same time, it would also be impractical for a bank to recompute your account balance from the full transaction history every time you open your banking application.</p><p>The same distinction exists within Coveo: events capture the history of interactions, while state represents higher-level business concepts derived from those events.</p><h3>Some states are implicit</h3><p>Certain business concepts are never explicitly represented as events.</p><p>For example, the concept of a visit is central to many commerce analytics metrics such as revenue per visit. Yet there is no explicit “start visit” or “end visit” event emitted by integrations. Instead, visits are inferred from patterns of related events occurring over time.</p><p>Reconstructing visits dynamically from billions of raw events every time a metric is requested would be computationally prohibitive. Persisting derived state makes these analytics practical.</p><h3>Some states are complex</h3></div>

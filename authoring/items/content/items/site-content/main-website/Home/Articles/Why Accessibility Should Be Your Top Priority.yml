      Value: |
        <div class="ck-content"><p>Here’s something worth sitting with: the search bar has always been a negotiation.</p><p>Not between the user and information, but between the user and a system’s limitations. Whether they knew what they needed or not, users had to type the right words. Adjust the syntax to see if that got them to the right results. Ask one thing at a time. Don’t be too vague, but don’t be too conversational. The unspoken contract of enterprise search has always been: you meet us halfway, and we’ll do our best.</p><p>Well, that contract has been broken. And the thing is, users didn’t break it; AI did.</p><h2>The Expectation Has Already Shifted</h2><p>Like the internet (albeit much faster), ChatGPT was a seismic shift in connection. Users stopped accepting the negotiation, and started asking questions the way they actually spoke. These queries — incomplete, contextual, layered — weren’t met with a ‘no results found’ or blue link list. Instead, the technology kept up. Maybe not perfectly, but enough to prove it was possible.</p><p>And that expectation didn’t stay in a personal context. It walks into work on Monday morning. It sits down at the help center, the support portal, the company intranet. And it brings with it a new standard.</p><p>The problem is that most enterprise search wasn’t built for that standard. It was built for a different era; one where users were expected to do the cognitive work the system couldn’t. That era is over, whether enterprise AI has caught up or not.</p><p>Relevant reading: You Can’t Prompt Engineer Your Way Out of a Bad Foundation</p><h2>We’ve Been Measuring the Wrong Thing</h2><p>The information retrieval industry spent years optimizing for relevance. Deliver the right document. Surface the right article. Rank the right result. These are real and meaningful problems, and solving them mattered.</p><p>But relevance isn’t the ceiling anymore. It’s the floor.</p><p>What users actually need isn’t a better-ranked list of documents. They need answers; ones they can trust, ones that make sense given everything they’ve already said in the conversation, ones that don’t require them to start over when they want to go deeper.</p><p>That’s a fundamentally different problem that requires a fundamentally different architecture to solve it.</p><p>Here’s the uncomfortable truth about where most enterprise AI sits right now: organizations have had to choose. Grounded or conversational or summarized. Pick the capability that matters most and accept the gaps that come with it. That’s not a product failure — it’s an architectural one.</p><p>The underlying systems weren’t designed to do all three simultaneously.</p><p>Relevant reading: What’s Stopping Organisations From Trusting Their Own AI?</p><h2>The Wow-Trust Gap Is Real, &amp; It’s Costly</h2><p>There’s a pattern I see play out constantly in enterprise AI deployments. A system looks extraordinary in a demo. The answers are fluent, the interface is clean, the stakeholders are impressed. Then it hits production — real users, real questions, real edge cases — and the cracks appear fast.</p><p>Answers that sound right but aren’t sourced. Responses that lose the thread the moment a user follows up. Confidence without accountability.</p><p>I call this the Wow-Trust Gap, and in enterprise environments it’s particularly damaging. A user who gets a wrong answer from an AI system doesn’t just abandon that interaction — they abandon the system. They call. They escalate. They tell someone the AI “doesn’t work.” The cost isn’t just a bad experience; it’s a regression in the organization’s ability to actually deliver self-service at scale.</p><p>Closing that gap means accepting that conversational capability and trustworthiness aren’t two separate workstreams. They have to be built together, from the ground up, or one will always undermine the other.</p><h2>What “Actually Solved” Looks Like</h2><p>The reason I’m writing this now is that I think we’re at a genuine inflection point — not a marketing one. Coveo’s Conversational Search, powered by what we’re calling the Coveo Search Agent, represents the first time I’ve seen all three capabilities — grounded, summarized, conversational — work together without the trade-off.</p><p>The architecture behind it isn’t a chatbot with a knowledge base bolted on. It’s an orchestration layer that reasons across retrieval steps, maintains memory across a session, and evaluates whether it actually has enough information to answer before it responds. When a user follows up, the system knows what came before. It builds on the conversation rather than resetting it.</p><p>And critically, it’s grounded in the same retrieval foundation that organizations have already validated in production. Customers like SAP and F5 have seen real, measurable outcomes — deflection, self-service success, reduced search friction — using the underlying platform.</p><p>Conversational Search inherits that foundation. The agentic reasoning layer is new; the trust in what it retrieves is not.</p><h2>The Real Question for Digital &amp; CX Leaders</h2><p>Conversational Search powered by Coveo Search Agent opens for beta today, April 7th, 2026 — across help centers, support portals, communities, intranets, wherever your users are actually searching.</p><p>But the technology question, while important, is secondary to a more fundamental one: do you believe users are going to keep raising their expectations, or do you think they’ll settle back into old habits?</p><p>I don’t think they’ll settle. I think the bar keeps moving. And organizations that treat AI-powered search as a feature rather than a foundation are going to keep chasing it.</p><p>The ones that get ahead of it will do so by building for the user they have now — not the user who was willing, a decade ago, to learn how to search.</p><p>Learn more about Conversational Search.</p><p>Eager to discuss how it could work in your organization? Schedule time with one of our search experts.</p><ul><li>Intro</li><li>The Expectation Has Already Shifted</li><li>We’ve Been Measuring the Wrong Thing</li><li>The Wow-Trust Gap Is Real, &amp; It’s Costly</li><li>What “Actually Solved” Looks Like</li><li>The Real Question for Digital &amp; CX Leaders</li></ul><h3>Related resources</h3></div>
